name: CI

# Runs the parts of Lumo that do not need a bridge: the domain model, the colour
# science, and the contract tests over recorded bridge responses. That is most of
# what breaks. The hardware suite (--verify-bridge, --test-lights,
# --test-scene-switch) still has to be run by a human with a bridge on the network;
# see README.
on:
  push:
    # staging too: snapshots land there first, and CONSTITUTION.md says CI runs on
    # them. Without this the only gate is the promotion pull request.
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code. A token that cannot
# write cannot be used to push, tag or publish if a step is ever compromised.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      # Pinned to a commit SHA. A tag is mutable: whoever controls the action can
      # repoint v4 at new code, which then runs inside this workflow.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Show toolchain
        run: swift --version

      # Both variants must compile. The classic build is the one nobody runs
      # day to day, so it is exactly the one that rots unnoticed.
      # Liquid Glass needs the macOS 26 SDK: `glassEffect` has to exist at compile
      # time, and `if #available` does not help with that — so the glass paths are
      # behind `#if LUMO_GLASS`, which Package.swift defines only for a 26+ target.
      # Runner images lag Xcode, so detect rather than assume. When a macOS 26
      # image ships, bump `runs-on` above and this starts covering glass by itself.
      - name: Detect SDK
        id: sdk
        run: |
          SDK=$(xcrun --show-sdk-version)
          echo "macOS SDK: $SDK"
          if [ "${SDK%%.*}" -ge 26 ]; then
            echo "glass=yes" >> "$GITHUB_OUTPUT"
          else
            echo "glass=no" >> "$GITHUB_OUTPUT"
            echo "::warning::SDK $SDK predates Liquid Glass; that variant is not built here"
          fi

      # Both variants must compile. The classic build is the one nobody runs day to
      # day, so it is exactly the one that rots unnoticed.
      - name: Build (Liquid Glass variant)
        if: steps.sdk.outputs.glass == 'yes'
        run: swift build

      - name: Build (classic variant)
        run: LUMO_MACOS_TARGET=14.0 swift build

      - name: Test
        run: |
          if [ "${{ steps.sdk.outputs.glass }}" = "yes" ]; then
            swift test
          else
            LUMO_MACOS_TARGET=14.0 swift test
          fi

      - name: Check security boundaries
        run: ./tools/check-boundaries.sh

      - name: Check docs carry no real identifiers
        run: ./tools/check-no-secrets.sh
